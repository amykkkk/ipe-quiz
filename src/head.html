<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보처리기사 실기 모의고사</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1d2330; --muted:#5f6877; --line:#dfe3ea;
  --accent:#2557d6; --accent-soft:#e8eefc; --ok:#13834a; --ok-soft:#e4f5eb;
  --bad:#c62f2f; --bad-soft:#fbe9e9; --warn:#a86400; --warn-soft:#fff3dc;
  --code-bg:#f2f4f7; --code-text:#1d2330;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161c; --card:#1c2029; --text:#e6e9ef; --muted:#9aa3b2; --line:#2e3441;
    --accent:#7ea2ff; --accent-soft:#232d47; --ok:#52c98a; --ok-soft:#18311f;
    --bad:#ff7b7b; --bad-soft:#3a1d1f; --warn:#f0b04a; --warn-soft:#352a14;
    --code-bg:#11141a; --code-text:#e6e9ef;
  }
}
:root[data-theme="dark"]{
  --bg:#13161c; --card:#1c2029; --text:#e6e9ef; --muted:#9aa3b2; --line:#2e3441;
  --accent:#7ea2ff; --accent-soft:#232d47; --ok:#52c98a; --ok-soft:#18311f;
  --bad:#ff7b7b; --bad-soft:#3a1d1f; --warn:#f0b04a; --warn-soft:#352a14;
  --code-bg:#11141a; --code-text:#e6e9ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.top{padding:28px 0 12px}
header.top .kicker{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.02em}
header.top h1{margin:4px 0 6px;font-size:26px;line-height:1.3}
header.top p{margin:0;color:var(--muted);font-size:14px}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:18px}
.bar-inner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.stats{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.nav a{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--muted);text-decoration:none;background:var(--card)}
.nav a.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.nav a.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.nav a.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;font-size:14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] button.primary{color:#0d1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0d1220}}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;scroll-margin-top:110px}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qnum{font-weight:800;font-size:18px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pts{margin-left:auto;font-size:13px;color:var(--muted)}
.qtext{margin:0 0 12px}
.qtext table{border-collapse:collapse;margin:8px 0;font-size:14px}
.qtext th,.qtext td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.qtext th{background:var(--code-bg)}
.qtext .box{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;background:var(--code-bg);font-size:15px}
.tblwrap{overflow-x:auto}
pre.code{background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;font-family:"D2Coding","Consolas","Menlo",monospace;font-size:14px;line-height:1.55;margin:0 0 14px}
.blanks{display:grid;gap:8px}
.blank{display:flex;align-items:center;gap:8px}
.blank label{min-width:56px;font-weight:600;font-size:14px;color:var(--muted)}
.blank input{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.blank input:focus{outline:2px solid var(--accent);outline-offset:0}
.blank input.ok{border-color:var(--ok);background:var(--ok-soft)}
.blank input.bad{border-color:var(--bad);background:var(--bad-soft)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.result{margin-top:14px;border-radius:10px;padding:14px 16px;display:none}
.result.show{display:block}
.result.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.result.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.result.part{background:var(--warn-soft);border:1px solid var(--warn)}
.result .verdict{font-weight:800;margin-bottom:6px}
.result.ok .verdict{color:var(--ok)} .result.bad .verdict{color:var(--bad)} .result.part .verdict{color:var(--warn)}
.result .ans{margin:4px 0 10px;font-size:15px}
.result .ans code{font-family:"D2Coding","Consolas",monospace;background:var(--card);padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.result .exp{font-size:15px;border-top:1px solid var(--line);padding-top:10px}
.result .exp pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font-family:"D2Coding","Consolas",monospace;font-size:13px;white-space:pre}
.result .exp code{font-family:"D2Coding","Consolas",monospace}
.override{font-size:13px;padding:5px 10px;margin-top:8px}
#final{display:none}
#final.show{display:block}
.score-big{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.cat-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.cat-table th,.cat-table td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.cat-table td.n{text-align:right;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
.note{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:30px}
@media (max-width:560px){header.top h1{font-size:21px}.card{padding:16px}.score-big{font-size:40px}}
</style>
